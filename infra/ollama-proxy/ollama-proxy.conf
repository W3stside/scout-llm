# The scraper's only route to Ollama — and deliberately a narrow one.
#
# Ollama's API is unauthenticated, and the scraper is the tier that parses hostile input.
# Before this proxy existed, host.docker.internal:host-gateway gave that tier a route to
# EVERY port on the host; now the scraper's network holds only this proxy, and the proxy
# forwards exactly the three endpoints Scout calls. Everything else — /api/generate,
# /api/pull, /api/delete, /api/create, model management, the lot — dead-ends here with 403.
#
# /api/show is included because modelSupportsVision() calls it at startup (src/llm/ollama.ts);
# without it, vision detection breaks and photo grading silently never runs.

server {
    listen 11434;
    server_tokens off;

    # Generation is slow and a cold model load can sit for minutes before the first byte.
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 600s;

    # Chat payloads carry base64 images (~5.5MB per 4MB photo) plus a condensed page.
    client_max_body_size 64m;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location = /api/chat {
        limit_except POST { deny all; }
        proxy_pass http://host.docker.internal:11434;
    }

    location = /api/tags {
        limit_except GET { deny all; }
        proxy_pass http://host.docker.internal:11434;
    }

    location = /api/show {
        limit_except POST { deny all; }
        proxy_pass http://host.docker.internal:11434;
    }

    location / {
        return 403;
    }
}
