# The scraper service.
#
# Run this from the HOST, not from inside the dev container — mounting the docker socket
# into the dev container would be equivalent to giving it host root, defeating the
# isolation the dev container exists to provide.
#
#   docker compose up -d --build
#   docker compose logs -f scraper
#
# Discovery also belongs in THIS tier, not the dev container. It fetches arbitrary URLs the
# model proposes, and arbitrary-URL work goes where no credentials are mounted:
#
#   docker compose run --rm scraper node dist/cli.js discover "BMW estate, diesel, under 15k"
#
# Trust model: this container has open egress because it must reach arbitrary sites, and it
# is safe to give it that ONLY because nothing sensitive is mounted here. Do not add
# credential mounts to this file. The bot token is the one secret it holds, and that is
# scoped to a single chat.
#
# Egress is open OUTWARD only. The scraper deliberately has no host.docker.internal mapping
# any more: a container that parses hostile HTML must not hold a route to every port on the
# host. Ollama is reached through ollama-proxy below, which forwards exactly the three API
# endpoints Scout uses and 403s everything else. The connect-time SSRF guard in the app
# (src/fetch/guard.ts) closes the remaining inward route — the bridge gateway address.
#
# Belt and braces on the host side: bind Ollama to the docker bridge rather than everything
# (OLLAMA_HOST=172.17.0.1 in the ollama service environment), so even a compromised
# container poking at gateway addresses finds nothing listening on 0.0.0.0.

services:
    scraper:
        build:
            context: .
            dockerfile: Dockerfile.scraper
        env_file: .env
        environment:
            # The GPU and the model live on the host; the container never loads weights.
            # Reached via the proxy — never the host gateway.
            OLLAMA_URL: http://ollama-proxy:11434
            SCOUT_MODEL: ${SCOUT_MODEL:-scout}
            DATA_DIR: /app/data
            TARGETS_DIR: /app/targets
            RECIPES_DIR: /app/recipes
            LOG_LEVEL: ${LOG_LEVEL:-info}
        depends_on:
            - ollama-proxy
        networks:
            # Two networks with different jobs: `scout` (internal, no NAT to anywhere) is
            # the proxy link, `egress` is the internet. Hostile-input parsing and the
            # host-facing plumbing never share a routable path.
            - scout
            - egress
        volumes:
            # SQLite state. Losing this is the only genuinely painful loss: without it every
            # listing looks new at once and you get a message burst.
            - ./data:/app/data
            # Both writable, and deliberately so — they were :ro until heal and /add existed:
            #   recipes/  self-repair regenerates a stale recipe in place
            #   targets/  the /add wizard and /pause | /resume write target files
            # Writing into the host repo is the intent, not a leak: it is what makes a
            # self-repair show up as a reviewable git diff rather than hidden container state.
            - ./recipes:/app/recipes
            - ./targets:/app/targets
        read_only: true
        tmpfs:
            # Chromium is heavy on temp space and shared memory; 512m avoids the renderer
            # crashes that a default 64m /dev/shm produces on listing pages full of images.
            - /tmp:size=512m
            - /dev/shm:size=512m
        # The image runs as pwuser (uid 1000). Overridden here so files written into the
        # bind-mounted recipes/ and targets/ are owned by YOU on the host rather than by a
        # uid that happens to match — otherwise a healed recipe lands root-owned and the
        # next `git commit` cannot stage it. Adjust if your host uid is not 1000.
        user: '${SCOUT_UID:-1000}:${SCOUT_GID:-1000}'
        cap_drop:
            - ALL
        security_opt:
            - 'no-new-privileges:true'
            # Chromium's renderer sandbox runs on unprivileged user namespaces, which
            # Docker's default seccomp profile blocks. This profile (Playwright's official
            # one) permits the userns clone/unshare the sandbox needs — WITHOUT granting
            # SYS_ADMIN or any capability. If browser fetches fail on an Ubuntu 23.10+
            # host, see the sandbox note in src/fetch/browser.ts before reaching for
            # SCOUT_BROWSER_NO_SANDBOX.
            - 'seccomp:./infra/scraper/seccomp-chromium.json'
        # Blunts a fork bomb or miner arriving via a compromised dependency.
        pids_limit: 2048
        mem_limit: 3g
        restart: unless-stopped
        healthcheck:
            # Liveness only. The real signal that Scout has gone deaf is the recipe-stale
            # warning it sends to Telegram, which no healthcheck can observe.
            test: ['CMD', 'node', '-e', 'process.exit(0)']
            interval: 60s
            timeout: 10s
            retries: 3

    # Ollama gatekeeper. The ONLY service holding a route to the host, and it forwards
    # exactly three endpoints (see infra/ollama-proxy/ollama-proxy.conf). The scraper
    # talks to this by service name; the unauthenticated Ollama API itself is never on
    # the scraper's network.
    ollama-proxy:
        image: nginxinc/nginx-unprivileged:1.27-alpine
        volumes:
            - ./infra/ollama-proxy/ollama-proxy.conf:/etc/nginx/conf.d/default.conf:ro
        extra_hosts:
            # Linux docker has no built-in host.docker.internal; this maps it to the bridge.
            - 'host.docker.internal:host-gateway'
        networks:
            - scout
        read_only: true
        tmpfs:
            - /tmp
        cap_drop:
            - ALL
        security_opt:
            - 'no-new-privileges:true'
        pids_limit: 128
        mem_limit: 128m
        restart: unless-stopped

networks:
    # internal: no NAT out of this network — the proxy has no internet egress at all, and
    # a compromised scraper gains nothing by talking to it beyond what nginx forwards.
    # Traffic to the HOST itself (the proxy's host-gateway route to Ollama) rides the
    # INPUT chain, not FORWARD, so it survives `internal: true` on current engines — but
    # if `scout doctor` cannot reach Ollama after deploy on yours, this flag is the first
    # thing to check, and dropping it is a small, deliberate loss.
    scout:
        driver: bridge
        internal: true
    egress:
        driver: bridge
